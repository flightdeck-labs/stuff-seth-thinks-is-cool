name: Deploy GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Keep the Astro build so Goose/Raindrop PRs still fail on invalid Markdown.
      # Do not upload `dist`: the public site moved to https://shr.dev/cool.
      - name: Build
        run: pnpm build
      - name: Prepare redirect Pages artifact
        run: bash scripts/prepare-pages-redirect.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # GitHub Pages cannot emit HTTP 302/301. This stub is meta-refresh + JS.
          path: pages-redirect-publish

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
